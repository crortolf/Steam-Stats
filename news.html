<!doctype html>

<html lang="en">
  <head>
    <title>Steam Stats</title>
    <meta charset="UTF-8" />
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="resources/percent.png" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="text/javascript" src="news.js" defer></script>
  </head>

  <body>
    <h1>Steam Stats</h1>
    <h3>Your go-to for all Steam number-based questions</h3>
    <div id="tabs-container">
      <h4>
        <a href="landing.html">HOME</a>
      </h4>
      <h4>
        <a href="connections.html">FRIEND CONNECTIONS</a>
      </h4>
      <h4>

      </h4>

      </h4>

    <form>
      <label for="user-steam-id">First user ID:</label>
      <input type="text" id="user-steam-id" name="user-steam-id" />
      <button type="button" onClick="getNews()">Update</button>
    </form>
    <div id="news-container"></div>
    <template id="game-news-template">
      <div class="flex margin steam-blue-border overflow">
        <img class="game-image" />
      </div>
    </template>
    <template id="news-card">
      <div class="news-article">
        <h4 class="news-title">News Title</h4>
        <h5 class="news-date">News Date</h5>
        <p class="news-content">news content</p>
      </div>
    </template>
